<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MushTimer - Bloom 打菇計時</title>
  <style>
    :root {
      --green: #4CAF50;
      --green-dark: #388E3C;
      --pink: #FF6B9D;
      --bg: #F8FFF8;
      --card: #FFFFFF;
      --text: #2E2E2E;
      --muted: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 80px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo .icon { font-size: 36px; }
    .logo h1 { font-size: 22px; color: var(--green-dark); }
    .logo p { font-size: 12px; color: var(--muted); }
    .free-count {
      background: var(--green);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .section { margin-bottom: 28px; }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h2 { font-size: 18px; color: var(--green-dark); }
    .card, .timer-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .timer-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-info h3 { font-size: 16px; margin-bottom: 4px; }
    .timer-info .location { font-size: 13px; color: var(--muted); }
    .countdown {
      font-size: 22px;
      font-weight: 700;
      color: var(--green);
      text-align: right;
    }
    .countdown.respawn { color: var(--pink); }
    .timer-actions button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      background: var(--card);
      border-radius: 16px;
    }
    label { display: block; font-size: 14px; margin: 12px 0 6px; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 12px; }
    .btn-primary, .btn-secondary {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--green); color: white; }
    .btn-secondary { background: #eee; color: var(--text); }
    .advice {
      margin-top: 12px;
      padding: 12px;
      background: #f0f9f0;
      border-radius: 10px;
      font-size: 14px;
      white-space: pre-line;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      padding: 20px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .alert-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 0, 0, 0.9);
      z-index: 200;
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: pulse 0.5s infinite alternate;
    }
    .alert-overlay.show { display: flex; }
    @keyframes pulse {
      from { background: rgba(255, 50, 50, 0.95); }
      to { background: rgba(200, 0, 0, 0.95); }
    }
    .alert-overlay h2 { font-size: 32px; margin-bottom: 16px; }
    .alert-overlay p { font-size: 20px; margin-bottom: 24px; }
    .timer-card.urgent {
      background: #ffebee;
      border: 2px solid #f44336;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <span class="icon">🍄</span>
        <div>
          <h1>MushTimer</h1>
          <p>Bloom 打菇計時助手</p>
        </div>
      </div>
      <div class="free-count" id="freeCount">今日免費：3/3</div>
      <button class="btn-secondary" id="notifyBtn" style="margin-left:8px; font-size:13px; padding:6px 10px;">開啟通知</button>
    </header>

    <main>
      <section id="timerList" class="section">
        <div class="section-header">
          <h2>進行中計時</h2>
          <button class="btn-primary" onclick="openAddModal()">+ 加計時</button>
        </div>
        <div id="timersContainer"></div>
        <div id="emptyState" class="empty">未有計時<br>點上面「加計時」開始</div>
      </section>

      <section class="section">
        <h2>隊伍建議</h2>
        <div class="card">
          <label>蘑菇類型</label>
          <select id="mushroomType">
            <option value="red">紅色蘑菇</option>
            <option value="yellow">黃色蘑菇</option>
            <option value="blue">藍色蘑菇</option>
            <option value="purple">紫色蘑菇</option>
            <option value="white">白色蘑菇</option>
            <option value="pink">粉色蘑菇</option>
            <option value="gray">灰色蘑菇</option>
            <option value="fire">🔥 火蘑菇</option>
            <option value="water">💧 水蘑菇</option>
            <option value="electric">⚡ 電蘑菇</option>
            <option value="poison">☠️ 毒蘑菇</option>
            <option value="crystal">💎 水晶蘑菇</option>
            <option value="event">活動 / 巨大菇</option>
          </select>
          <button class="btn-secondary" onclick="giveAdvice()">畀建議</button>
          <div id="adviceResult" class="advice"></div>
        </div>
      </section>
    </main>

    <div id="modal" class="modal">
      <div class="modal-content">
        <h3>加新計時</h3>
        <label>地點名稱（可選）</label>
        <input type="text" id="locationName" placeholder="例如：公園大門">
        <label>遊戲畫面剩餘時間</label>
        <input type="text" id="remainingMin" placeholder="例如：5.3（5分3秒）或 12:30" inputmode="decimal">
        <p class="hint">支援格式：5.3 = 5分3秒　｜　12 = 12分鐘　｜　會自動 +5 分鐘計算重生</p>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeModal()">取消</button>
          <button class="btn-primary" onclick="addTimer()">加入</button>
        </div>
      </div>
    </div>

    <footer>
      <p>專為 Pikmin Bloom 打菇而設 · 數據只儲存喺你部手機</p>
    </footer>
  </div>

  <script>
    let timers = JSON.parse(localStorage.getItem('mushTimers') || '[]');
    let freeAttempts = parseInt(localStorage.getItem('freeAttempts') || '3');
    let lastReset = localStorage.getItem('lastReset') || new Date().toDateString();

    if (lastReset !== new Date().toDateString()) {
      freeAttempts = 3;
      lastReset = new Date().toDateString();
      localStorage.setItem('freeAttempts', freeAttempts);
      localStorage.setItem('lastReset', lastReset);
    }

    function save() {
      localStorage.setItem('mushTimers', JSON.stringify(timers));
      localStorage.setItem('freeAttempts', freeAttempts);
    }

    function updateFreeDisplay() {
      document.getElementById('freeCount').textContent = `今日免費：${freeAttempts}/3`;
    }

    function renderTimers() {
      const container = document.getElementById('timersContainer');
      const empty = document.getElementById('emptyState');
      container.innerHTML = '';

      if (timers.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      timers.sort((a, b) => a.respawnAt - b.respawnAt);

      timers.forEach((t, i) => {
        const now = Date.now();
        const remain = t.respawnAt - now;
        const card = document.createElement('div');
        card.className = 'timer-card' + (remain > 0 && remain < 300000 ? ' urgent' : '');

        let timeStr = '';
        let isRespawn = remain > 0;
        if (remain > 0) {
          const m = Math.floor(remain / 60000);
          const s = Math.floor((remain % 60000) / 1000);
          timeStr = `重生 ${m}:${s.toString().padStart(2,'0')}`;
        } else {
          timeStr = '已重生！';
        }

        card.innerHTML = `
          <div class="timer-info">
            <h3>${t.name || '未命名位置'}</h3>
            <div class="location">${isRespawn ? '等待重生' : '可以搶！'}</div>
          </div>
          <div class="countdown ${isRespawn ? 'respawn' : ''}">${timeStr}</div>
          <div class="timer-actions">
            <button onclick="removeTimer(${i})">🗑️</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openAddModal() {
      document.getElementById('modal').classList.add('show');
      document.getElementById('locationName').value = '';
      document.getElementById('remainingMin').value = '';
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function addTimer() {
      const name = document.getElementById('locationName').value.trim();
      const input = document.getElementById('remainingMin').value.trim();
      if (!input) {
        alert('請輸入剩餘時間');
        return;
      }

      let totalSeconds = 0;
      if (input.includes(':')) {
        // Format: 5:3 or 5:03
        const parts = input.split(':');
        const mins = parseInt(parts[0]) || 0;
        const secs = parseInt(parts[1]) || 0;
        totalSeconds = mins * 60 + secs;
      } else if (input.includes('.')) {
        // Format: 5.3 = 5 min 3 sec
        const parts = input.split('.');
        const mins = parseInt(parts[0]) || 0;
        let secs = parseInt(parts[1]) || 0;
        if (secs > 59) secs = 59;
        totalSeconds = mins * 60 + secs;
      } else {
        // Plain number = minutes
        const mins = parseFloat(input);
        if (isNaN(mins) || mins < 0) {
          alert('請輸入有效時間');
          return;
        }
        totalSeconds = Math.round(mins * 60);
      }

      if (totalSeconds <= 0) {
        alert('請輸入有效時間');
        return;
      }

      const respawnAt = Date.now() + (totalSeconds + 5 * 60) * 1000;
      timers.push({ name, respawnAt, created: Date.now() });
      save();
      closeModal();
      renderTimers();

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function removeTimer(i) {
      if (confirm('刪除呢個計時？')) {
        timers.splice(i, 1);
        save();
        renderTimers();
      }
    }

    function giveAdvice() {
      const type = document.getElementById('mushroomType').value;
      const result = document.getElementById('adviceResult');

      const tips = {
        red: '優先紅色皮克敏（同色 +12）\n再加高友好度 + 當月主花\n紫/岩石可作補充',
        yellow: '優先黃色皮克敏（同色 +12）\n當月主花加成最高',
        blue: '優先藍色皮克敏（同色 +12）',
        purple: '紫色同岩石都好用\n紫色基礎分最高',
        white: '優先白色皮克敏',
        pink: '優先粉色（羽翅）皮克敏',
        gray: '優先岩石（灰色）皮克敏',
        fire: '只能用紅色皮克敏！\n對應屬性 +100，非常重要',
        water: '只能用藍色皮克敏！',
        electric: '只能用黃色皮克敏！',
        poison: '只能用白色皮克敏！',
        crystal: '只能用岩石皮克敏！',
        event: '優先有當月活動飾品嘅皮克敏（加成超高）\n再加同色或高友好度 + 主花\n週末巨大菇優先用免費次數'
      };

      result.textContent = tips[type] || '請選擇類型';
    }

    function checkInAppAlerts() {
      const now = Date.now();
      let urgentTimer = null;
      timers.forEach(t => {
        const remain = t.respawnAt - now;
        if (remain > 0 && remain < 280000 && !t.alerted) {
          urgentTimer = t;
          t.alerted = true;
          save();
        }
      });
      if (urgentTimer) {
        const overlay = document.getElementById('alertOverlay');
        document.getElementById('alertText').textContent = (urgentTimer.name || '位置') + ' 快要重生！';
        overlay.classList.add('show');
        // Vibrate if supported
        if (navigator.vibrate) {
          navigator.vibrate([200, 100, 200, 100, 400]);
        }
        // Optional beep
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 800;
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch(e) {}
      }
    }

    function dismissAlert() {
      document.getElementById('alertOverlay').classList.remove('show');
    }
      function checkNotifications() {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const now = Date.now();
      timers.forEach(t => {
        const remain = t.respawnAt - now;
        if (remain > 0 && remain < 280000 && !t.notified) {
          new Notification('菇計時提醒', {
            body: `${t.name || '位置'} 快要重生！`,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍄</text></svg>'
          });
          t.notified = true;
          save();
        }
      });
    }

    // Notification permission button
    const notifyBtn = document.getElementById('notifyBtn');
    function updateNotifyBtn() {
      if (!('Notification' in window)) {
        notifyBtn.textContent = '不支援通知';
        notifyBtn.disabled = true;
        return;
      }
      if (Notification.permission === 'granted') {
        notifyBtn.textContent = '通知已開啟';
        notifyBtn.style.background = '#4CAF50';
        notifyBtn.style.color = 'white';
      } else if (Notification.permission === 'denied') {
        notifyBtn.textContent = '通知被拒絕';
        notifyBtn.disabled = true;
      } else {
        notifyBtn.textContent = '開啟通知';
      }
    }
    notifyBtn.onclick = async () => {
      if (!('Notification' in window)) {
        alert('你嘅瀏覽器不支援通知');
        return;
      }
      try {
        const perm = await Notification.requestPermission();
        updateNotifyBtn();
        if (perm === 'granted') {
          alert('通知已開啟！之後重生前會收到提醒');
        } else if (perm === 'denied') {
          alert('通知被拒絕。請到瀏覽器設定手動開啟通知權限');
        }
      } catch (e) {
        alert('請求通知失敗（可能係 file:// 限制）。建議上傳到網址再用');
      }
    };
    updateNotifyBtn();

    // Init timers
    updateFreeDisplay();
    renderTimers();
    setInterval(renderTimers, 1000);
    setInterval(checkNotifications, 5000);
    setInterval(checkInAppAlerts, 1000);

    document.getElementById('freeCount').onclick = () => {
      if (freeAttempts > 0 && confirm('用咗一次免費打菇？')) {
        freeAttempts--;
        save();
        updateFreeDisplay();
      } else if (freeAttempts === 0) {
        alert('今日免費次數已用完');
      }
    };
  </script>
</body>
</html>
